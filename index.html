<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Linux Monitor</title>
</head>
<body>
    <div id="AllTheThings">
        <div class="Info">
            <p id="hostname" class="Infotext"></p>
        </div>
        <div class="Info">
            <p id="kernel" class="Infotext"></p>
        </div>
        <div class="Info">
            <p id="cpu" class="Infotext"></p>
        </div> 
        <div class="Info">
            <p id="disk" class="Infotext"></p>
        </div>
        <div class="Info">
            <p id="RAM" class="Infotext"></p>
        </div>                      
        <div class="Info">
            <p id="process" class="Infotext"></p>
        </div>       
    </div>
</body>
<script src="script.js"></script>
</html>
